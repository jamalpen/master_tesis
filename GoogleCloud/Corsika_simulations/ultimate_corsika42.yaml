apiVersion: batch/v1
kind: Job
metadata:
  name: simulation-job42 #From simulation 4 to 6
spec:
  completions: 1 # numbers of simulations
  parallelism: 1  #Execute n simulations in parallel
  template:
    spec:
      containers:
      - name: simulation-container
        image: jpenafiell/corsika:latest
        command: ["/bin/bash"]
        args:
        - "-c"
        - |
          echo "---- Start of the job ----"

          # Change to the appropriate working directory
          echo "Changing to the working directory /home"
          cd /home || { echo "Error changing to /home directory"; exit 1; }

          export ARTI=/opt/arti

          # Verify the working directory and environment variables
          echo "Verifying the working directory and environment variables"
          echo "Current directory: $(pwd)"
          echo "Environment variables:"
          echo "PATH: $PATH"
          echo "ARTI: $ARTI"
          ls /opt/arti/sims || { echo "Error listing contents of /opt/arti/sims"; exit 1; }
          env

          # Define the simulation index using the completion index (pod number)
          SIMULATION_INDEX=$(( ${POD_COMPLETION_INDEX} + 42 ))
          echo "POD_COMPLETION_INDEX: ${POD_COMPLETION_INDEX}"
          echo "SIMULATION_INDEX: ${SIMULATION_INDEX}"

          # Authenticate with Google Cloud using the service account
          echo "Authenticating with Google Cloud using the service account"
          gcloud auth activate-service-account --key-file=/secret/key.json || { echo "Error al autenticar con la cuenta de servicio"; exit 1; }

          # Download the datos_X.txt file from the bucket
          echo "Downloading the file datos_${SIMULATION_INDEX}.txt from the bucket"
          gsutil cp gs://mycorsika-bucket/datos_${SIMULATION_INDEX}.txt /home/datos_${SIMULATION_INDEX}.txt || { echo "Error al descargar datos_${SIMULATION_INDEX}.txt desde el bucket"; exit 1; }

          # Rename datos_X.txt to datos.txt
          echo "Renaming the file datos_${SIMULATION_INDEX}.txt to datos.txt"
          mv /home/datos_${SIMULATION_INDEX}.txt /home/datos.txt || { echo "Error renaming datos_${SIMULATION_INDEX}.txt to datos.txt"; exit 1; }

          # Check permissions and grant execution permissions if necessary
          echo "Checking execution permissions for integrated_run.sh"
          chmod +x /home/integrated_run.sh || { echo "Error granting permissions to integrated_run.sh"; exit 1; }

          # Add a wait to ensure the files are ready
          echo "Waiting 5 seconds to ensure files are ready"
          sleep 5

          # Run the simulation
          echo "Running the simulation with integrated_run.sh"
          ./integrated_run.sh || { echo "Error running integrated_run.sh"; exit 1; }

          # Generate a unique timestamp
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          echo "Generated timestamp: $TIMESTAMP"

          # Upload the results folder to Google Cloud Storage
          echo "Uploading the results folder to Google Cloud Storage"
          gsutil cp -r /home/results gs://mycorsika-bucket/results_${SIMULATION_INDEX}_$TIMESTAMP/ || { echo "Error uploading results folder to Google Cloud Storage"; exit 1; }

          echo "---- End of job ----"
        resources:
          limits:
            memory: "16Gi"    # Set a maximum memory limit of 4GiB per pod
            cpu: "4"        # Limit CPU usage to 4 vCPUs per pod (the maximum available per node)
          requests:
            memory: "8Gi"    # Request at least 2GiB of memory for each pod
            cpu: "2"        # Request a minimum of 2 vCPUs
        env:
        - name: PATH
          value: /opt/arti/sims/:/opt/arti/eas:/opt/arti/analysis:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

        volumeMounts:
        - name: gcs-key-volume
          mountPath: /secret
      volumes:
      - name: gcs-key-volume
        secret:
          secretName: gcs-mycorsika-key
      restartPolicy: Never
